<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Painted Diorama — Style Test</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f3ead9;font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif;color:#3b2a2a;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  .top{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
  .top button{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;background:#fffaf0;color:#3b2a2a;box-shadow:0 2px 0 #d8c9ad}
  .top button.on{background:#2b9a8c;color:#fff;box-shadow:0 2px 0 #1f7d72}
  #hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:13px;opacity:.65;pointer-events:none;transition:opacity .4s}
  /* dialogue card */
  #card{position:fixed;left:50%;bottom:-420px;transform:translateX(-50%);width:min(560px,calc(100vw - 20px));background:#fbf4e6;border-radius:22px;box-shadow:0 10px 30px rgba(70,45,30,.25),0 3px 0 #e2d3b6;transition:bottom .55s cubic-bezier(.2,1.3,.4,1);z-index:10;overflow:hidden}
  #card.open{bottom:14px}
  #card .row{display:flex;gap:6px;align-items:flex-end;padding:10px 14px 0}
  #puppet{width:150px;height:130px;flex:none;margin-left:-10px}
  #bubble{flex:1;background:#fff;border-radius:16px;padding:12px 14px;font-size:17px;line-height:1.35;min-height:72px;position:relative;margin-bottom:22px;box-shadow:0 2px 0 #eadcc2}
  #bubble:before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:#fff;border-left:0}
  #name{font-weight:800;color:#e5664a;font-size:13px;letter-spacing:.04em;margin-bottom:2px}
  #choices{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
  #choices button{border:0;border-radius:14px;padding:12px;font:inherit;font-size:16px;font-weight:700;background:#e8b04a;color:#3b2a2a;box-shadow:0 3px 0 #c58f2c;text-align:left}
  #choices button:nth-child(2){background:#9fd3c7;box-shadow:0 3px 0 #74b3a5}
  #card .grain{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply}
  .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:150px 230px}
  .talking .bob{animation:bobTalk .32s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-1.5deg)}}
  @keyframes bobTalk{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.03)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <button id="painted" class="on">Painted</button>
  <button id="crisp">Crisp</button>
  <button id="windy">Windy</button>
  <button id="optBtn" class="on">⚡ Optimised</button>
  <button id="flyBtn">Fly</button>
</div>
<div id="timebar" style="position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(255,250,240,.85);padding:6px 12px;border-radius:999px;box-shadow:0 2px 0 #d8c9ad;z-index:5;font-size:13px;font-weight:700">
  <span id="todlabel" style="width:74px">Afternoon</span>
  <input id="tod" type="range" min="0" max="1000" value="600" style="width:min(46vw,220px);accent-color:#e8b04a">
  <button id="cycle" style="border:0;border-radius:999px;padding:5px 10px;font:inherit;background:#2b9a8c;color:#fff">▶</button>
</div>
<div id="perf" style="position:fixed;left:8px;top:54px;z-index:6;background:rgba(255,250,240,.85);border-radius:8px;padding:4px 8px;font:600 11px/1.35 ui-monospace,Menlo,monospace;color:#3b2a2a;pointer-events:none;white-space:pre"></div>
<div id="grainOv" style="position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.28;z-index:1;display:none"></div>
<div id="hint">Walk through the tall grass · drag to turn · tap Pip</div>

<div id="card">
  <svg class="grain" width="100%" height="100%"><filter id="cg"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="4"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#cg)" opacity=".5"/></svg>
  <div class="row">
    <svg id="puppet" viewBox="0 0 300 260">
      <defs>
        <filter id="paint" x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="2" result="warp"/>
          <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" xChannelSelector="R" yChannelSelector="G" result="wob"/>
          <feTurbulence type="fractalNoise" baseFrequency="0.015 0.07" numOctaves="4" seed="9" result="mot"/>
          <feColorMatrix in="mot" type="saturate" values="0" result="mg"/>
          <feComponentTransfer in="mg" result="mg2"><feFuncR type="linear" slope="0.42" intercept="0.74"/><feFuncG type="linear" slope="0.42" intercept="0.74"/><feFuncB type="linear" slope="0.42" intercept="0.74"/></feComponentTransfer>
          <feBlend in="wob" in2="mg2" mode="multiply" result="m"/>
          <feComposite in="m" in2="wob" operator="in"/>
        </filter>
        <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
        <filter id="blush" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <ellipse cx="150" cy="238" rx="105" ry="14" fill="#3b2a2a" opacity=".12"/>
      <g class="bob">
        <g id="pspines" filter="url(#paint)"></g>
        <g filter="url(#paint)">
          <ellipse cx="205" cy="160" rx="62" ry="50" fill="#f1dcc0"/>
          <ellipse cx="120" cy="222" rx="22" ry="12" fill="#d9bc98"/>
          <ellipse cx="200" cy="222" rx="22" ry="12" fill="#d9bc98"/>
        </g>
        <ellipse cx="222" cy="182" rx="17" ry="11" fill="#ef7f6a" opacity=".5" filter="url(#blush)"/>
        <circle cx="262" cy="160" r="11" fill="#2f2226" filter="url(#rough)"/>
        <circle cx="258" cy="156" r="3" fill="#fff" opacity=".7"/>
        <g id="eyeOpen"><ellipse cx="214" cy="140" rx="7" ry="9" fill="#2f2226"/><circle cx="216" cy="137" r="2.5" fill="#fff"/></g>
        <path id="eyeShut" d="M204 141 Q214 150 224 141" stroke="#2f2226" stroke-width="4.5" fill="none" stroke-linecap="round" style="display:none"/>
        <path id="mouth" d="M236 186 Q244 194 252 186" stroke="#2f2226" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#rough)"/>
        <ellipse id="mouthOpen" cx="244" cy="189" rx="7" ry="6" fill="#7a3a34" style="display:none"/>
      </g>
    </svg>
    <div id="bubble"><div id="name">PIP</div><div id="text"></div></div>
  </div>
  <div id="choices"></div>
</div>

<div id="err" style="position:fixed;left:10px;right:10px;top:60px;background:#fff3f0;color:#a33;border-radius:10px;padding:8px 10px;font-size:12px;display:none;z-index:20"></div>
<div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;opacity:.7;pointer-events:none">Painting the diorama…</div>
<script>
addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + (e.message || e.error) + (e.lineno ? ' (line ' + e.lineno + ')' : ''); });
</script>
<script>
setTimeout(() => {
'use strict';
// ============ performance settings ============
// OPT switches between the original renderer (every stack redrawn slice by slice, every frame)
// and the optimised one (cached layers, impostors, a pixel budget). See code-first-techniques.md.
let OPT = true;
let renderScale = 1;                                   // dynamic resolution, 0.75..1 (optimised mode)
const ANG_STEPS = 256, ASTEP = Math.PI * 2 / ANG_STEPS; // rotation is snapped to 1.4 degree steps so caches can be reused
// Benchmark mode (?bench): a fixed pixel ratio (no dynamic resolution) and feature switches for ablation runs.
const BENCH = { on: /[?&]bench\b/.test(location.search), dpr: 0, drag: 0, rec: null };
const KNOB = { lampShadows: true, nightLayer: true, glows: true, moverShadows: true };
const targetDPR = () => BENCH.dpr ? BENCH.dpr : OPT ? Math.min(1.5, devicePixelRatio || 1) * renderScale : Math.min(2, devicePixelRatio || 1);
const PERF = { draws: 0, builds: 0, rebuilds: 0, evict: 0, frame: [], gap: [], lastHud: 0, lastScale: 0, cacheReady: false,
  ph: { layer: 0, shadows: 0, stacks: 0, nightBuild: 0, nightComp: 0, glows: 0 } };   // CPU ms per phase, this frame

// ============ canvas ============
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, S, S0, zoom = 1;   // S = S0 * zoom; zoom is 1 except in flight
function resize(){
  DPR = targetDPR();
  W = cv.width = Math.floor(innerWidth * DPR); H = cv.height = Math.floor(innerHeight * DPR);
  S0 = Math.min(innerWidth / 130, innerHeight / 140) * DPR;     // screen px per world unit
  S = S0 * zoom;
  if (PERF.cacheReady) clearCaches();
}
addEventListener('resize', resize); resize();

// ============ helpers ============
function hash(x, y, z){ let h = (x * 374761393 + y * 668265263 + z * 1442695041) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function noise3(x, y, z){
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z), fx = x - xi, fy = y - yi, fz = z - zi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  const L = (a, b, t) => a + (b - a) * t;
  const c = (i, j, k) => hash(xi + i, yi + j, zi + k);
  return L(L(L(c(0,0,0), c(1,0,0), u), L(c(0,1,0), c(1,1,0), u), v), L(L(c(0,0,1), c(1,0,1), u), L(c(0,1,1), c(1,1,1), u), v), w);
}
const hex = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const mul = (c, k) => [c[0] * k, c[1] * k, c[2] * k];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

// ---- the shared storybook palette (same as the gouache drawing) ----
const P = {
  cream: hex('#f6ecd8'), paper: hex('#f3ead9'), ink: hex('#3b2a2a'),
  mustard: hex('#e8b04a'), coral: hex('#e5664a'), teal: hex('#2b9a8c'), tealDk: hex('#1f7d72'),
  mint: hex('#9fd3c7'), sage: hex('#8fbf6a'), sageDk: hex('#6a9f52'), leaf: hex('#4f9a4a'), pine: hex('#2f7a55'), pineDk: hex('#21573f'),
  soil: hex('#a0704c'), soilDk: hex('#7a5236'), sand: hex('#ead2a2'), water: hex('#7fb8c9'), waterLt: hex('#b9dde3'),
  bark: hex('#7a5236'), peach: hex('#f2c4a2'), lav: hex('#c7a6d9'), brown: hex('#8b5e3c'), warm: hex('#ffd77a')
};

// ============ voxel models: crisp + painted slices from one grid ============
// fn(u,v,w) gets continuous coords in model units and returns [r,g,b] | null.
function buildModel(w, d, h, R, fn, opt = {}){
  const X = Math.round(w * R), Y = Math.round(d * R), Z = Math.round(h * R);
  const grid = new Array(X * Y * Z);
  for (let z = 0; z < Z; z++) for (let y = 0; y < Y; y++) for (let x = 0; x < X; x++)
    grid[(z * Y + y) * X + x] = fn((x + .5) / R, (y + .5) / R, (z + .5) / R) || null;
  const occ = (x, y, z) => x >= 0 && y >= 0 && z >= 0 && x < X && y < Y && z < Z && grid[(z * Y + y) * X + x] !== null;
  // All slices of a model live in one atlas canvas (1px transparent gutter around each slice),
  // so a scene needs two canvases per model instead of two per slice.
  const AW = X + 2, AH = (Y + 2) * Z;
  const ac = document.createElement('canvas'), ap = document.createElement('canvas');
  ac.width = ap.width = AW; ac.height = ap.height = AH;
  const cctx = ac.getContext('2d'), pctx = ap.getContext('2d');
  const ci = cctx.createImageData(AW, AH), pi = pctx.createImageData(AW, AH);
  const has = [];
  const sx = (opt.seed || 1) * 17.3;
  // Sheen levels: extra atlases where the upper slices catch the light a little more each level.
  const SL = opt.sheen || 0, SHEEN = [238, 242, 168];
  const lc = [], lp = [], lci = [], lpi = [];
  for (let l = 1; l < SL; l++){
    const a = document.createElement('canvas'), b = document.createElement('canvas');
    a.width = b.width = AW; a.height = b.height = AH;
    lc.push(a); lp.push(b); lci.push(a.getContext('2d').createImageData(AW, AH)); lpi.push(b.getContext('2d').createImageData(AW, AH));
  }
  for (let z = 0; z < Z; z++){
    let any = false;
    for (let y = 0; y < Y; y++) for (let x = 0; x < X; x++){
      const col = grid[(z * Y + y) * X + x]; if (!col) continue;
      any = true;
      const top = !occ(x, y, z + 1);
      let edge = 0;
      if (!occ(x - 1, y, z)) edge++; if (!occ(x + 1, y, z)) edge++; if (!occ(x, y - 1, z)) edge++; if (!occ(x, y + 1, z)) edge++;
      const ao = 0.8 + 0.2 * Math.pow(z / Math.max(1, Z - 1), 0.6);
      const k = ao * (top ? 1.1 : edge ? 0.86 : 1);
      const c1 = mul(col, k);
      const n1 = noise3(x * 0.22 + sx, y * 0.22, z * 0.3);
      const n2 = noise3(x * 0.08 + sx, y * 0.45, z * 0.15 + 9);
      let c2 = mul(col, ao * (0.84 + 0.24 * n1 + 0.1 * n2));
      if (top) c2 = mix(c2, [255, 244, 214], edge ? 0.06 : 0.14);
      else if (edge) c2 = mix(mul(c2, 0.86), [70, 60, 110], 0.08);
      if (edge >= 1 && hash(x, y, z + 77) < 0.55) c2 = mul(c2, 0.9);
      if (hash(x * 3, y * 7, z) < 0.04) c2 = mix(c2, [255, 250, 235], 0.3);
      const i = ((z * (Y + 2) + y + 1) * AW + x + 1) * 4;
      ci.data[i] = c1[0]; ci.data[i+1] = c1[1]; ci.data[i+2] = c1[2]; ci.data[i+3] = 255;
      pi.data[i] = c2[0]; pi.data[i+1] = c2[1]; pi.data[i+2] = c2[2]; pi.data[i+3] = 255;
      for (let l = 1; l < SL; l++){
        const k2 = (l / (SL - 1)) * 0.6 * Math.pow((z + 1) / Z, 1.5) * (top ? 1.15 : 1);
        const a1 = mix(c1, SHEEN, k2), a2 = mix(c2, SHEEN, k2), A1 = lci[l - 1].data, A2 = lpi[l - 1].data;
        A1[i] = a1[0]; A1[i+1] = a1[1]; A1[i+2] = a1[2]; A1[i+3] = 255;
        A2[i] = a2[0]; A2[i+1] = a2[1]; A2[i+2] = a2[2]; A2[i+3] = 255;
      }
    }
    has.push(any);
  }
  cctx.putImageData(ci, 0, 0); pctx.putImageData(pi, 0, 0);
  lc.forEach((c, j) => c.getContext('2d').putImageData(lci[j], 0, 0));
  lp.forEach((c, j) => c.getContext('2d').putImageData(lpi[j], 0, 0));
  // level 0 is the plain model; levels 1.. are increasingly sunlit
  return { X, Y, Z, R, crisp: ac, painted: ap, has, sheenC: [ac, ...lc], sheenP: [ap, ...lp] };
}

// ---- ground slab: a pop-up-book disc of grass on layers of soil ----
const GR = 62, GH = 7;
const pondC = [-27, 20], pondR = 12;
function pathDist(x, y){ // distance to the path: a curve from the cottage door to the rim
  let m = 1e9;
  for (let t = 0; t <= 1; t += 0.02){
    const px = 2 + 34 * t + 10 * Math.sin(t * 3), py = -10 + 60 * t;
    m = Math.min(m, Math.hypot(x - px, y - py));
  }
  return m;
}
const flowers = []; seed = 3;
for (let i = 0; i < 90; i++){ const a = rnd() * 6.28, r = rnd() * (GR - 4); flowers.push([Math.cos(a) * r, Math.sin(a) * r, [P.coral, P.mustard, P.cream, P.lav][(rnd() * 4) | 0]]); }
const ground = buildModel(GR * 2, GR * 2, GH, 1, (u, v, w) => {
  const x = u - GR, y = v - GR, r = Math.hypot(x, y);
  const wob = Math.sin(Math.atan2(y, x) * 7) * 0.8 + Math.sin(Math.atan2(y, x) * 13 + 1) * 0.5;
  const top = w > GH - 1.2;
  if (r > GR - (GH - w) * 0.35 + wob) return null;
  if (!top) return mix(P.soilDk, P.soil, w / GH);
  if (r > GR - 1.5 + wob) return P.sageDk;
  const pd = Math.hypot(x - pondC[0], y - pondC[1]);
  if (pd < pondR + Math.sin(Math.atan2(y - pondC[1], x - pondC[0]) * 5) * 1.2) return pd > pondR - 2 ? P.waterLt : P.water;
  if (pd < pondR + 2.6) return P.sand;
  const p = pathDist(x, y);
  if (p < 4.2) return p > 3.2 ? mix(P.sand, P.sageDk, 0.4) : P.sand;
  for (const [fx, fy, fc] of flowers) if (Math.hypot(x - fx, y - fy) < 0.9 && p > 5) return fc;
  for (const [mx, my, mr] of [[-22, -6, 13], [40, 28, 10], [-6, 40, 8]]) if (Math.hypot(x - mx, y - my) < mr + 2 + noise3(x * .3, y * .3, 4) * 3) return mix(P.sageDk, P.leaf, noise3(x * .2, y * .2, 5) * .5);
  return noise3(x * 0.12, y * 0.12, 1) > 0.55 ? P.sage : mix(P.sage, P.sageDk, 0.35);
}, { seed: 1 });

// ---- props ----
const cottage = buildModel(20, 16, 20, 2, (u, v, w) => {
  const x = u - 10, y = v - 8;
  // walls (door faces +x)
  if (w < 9 && Math.abs(x) < 7.5 && Math.abs(y) < 5.5){
    if (x > 7 && Math.abs(y) < 1.6 && w < 6) return P.teal;                                        // door
    if (x > 7 && Math.abs(y) > 2.8 && Math.abs(y) < 4.6 && w > 3.5 && w < 6.5) return P.warm;      // front windows
    if (Math.abs(y) > 5 && Math.abs(x) < 3 && w > 3.5 && w < 6.5) return P.warm;                   // side windows
    if (w < 1.2) return P.brown;
    return P.cream;
  }
  // gable roof along x, overhanging
  const rz = w - 8.6, half = 7.6 - rz * 0.95;
  if (rz >= 0 && Math.abs(x) < 9 && Math.abs(y) < half){
    if (x > 2 && x < 4.6 && y > 1.8 && y < 4.2) return mix(P.coral, P.ink, .3);                    // chimney inside roof
    return (Math.abs(y) > half - 1.2) ? mul(P.coral, .88) : P.coral;
  }
  if (x > 2 && x < 4.6 && y > 1.8 && y < 4.2 && w < 18) return mix(P.coral, P.ink, .3);           // chimney
  return null;
}, { seed: 2 });
const memo = (f) => { const c = {}; return (k) => c[k] || (c[k] = f(k)); };
const pine = memo((s) => buildModel(12, 12, 22 + s * 2, 2, (u, v, w) => {
  const x = u - 6, y = v - 6, r = Math.hypot(x, y), H = 22 + s * 2;
  if (w < 4) return r < 1.1 ? P.bark : null;
  for (let k = 3; k >= 0; k--){
    const b = 3 + k * (H - 9) / 3, t = (w - b) / 8; if (t < 0 || t > 1) continue;
    let rr = (5.6 - k * 0.8) * Math.pow(1 - t, 1.1) * (0.9 + 0.1 * Math.sin(Math.atan2(y, x) * 6 + k + s));
    if (r < rr) return k % 2 ? P.pine : mix(P.pine, P.pineDk, .4);
  }
  return null;
}, { seed: 3 + s }));
const roundTree = memo((s) => buildModel(14, 14, 18, 2, (u, v, w) => {
  const x = u - 7, y = v - 7;
  if (w < 7 && Math.hypot(x, y) < 1.2) return P.bark;
  const blobs = [[0, 0, 11, 5.6], [-2.5, 1, 9, 4], [2.6, -1, 9.5, 4], [0.5, 2, 13.5, 3.8]];
  for (const [bx, by, bz, br] of blobs) if (Math.hypot(x - bx, y - by, (w - bz) * 1.1) < br) return s % 2 ? P.leaf : mix(P.leaf, P.sage, .45);
  return null;
}, { seed: 9 + s }));
const mushroom = buildModel(5, 5, 5, 3, (u, v, w) => {
  const x = u - 2.5, y = v - 2.5, r = Math.hypot(x, y);
  if (w < 2.4) return r < 0.8 ? P.cream : null;
  const cap = 2.3 - (w - 2.4) * 0.8;
  if (r < cap) return (w > 3 && Math.abs(Math.sin(x * 3.1) * Math.cos(y * 3.3)) > 0.82) ? P.cream : P.coral;
  return null;
}, { seed: 4 });
const lantern = buildModel(4, 4, 15, 3, (u, v, w) => {

    ctx.fillStyle = `rgba(255,226,120,${blink * (.25 + .75 * E.night)})`; ctx.beginPath(); ctx.arc(sx, sy - lift0 - fh * S * .92, 0.7 * S, 0, 7); ctx.fill();
  }

  if (FLY.on){ const [bx, by] = proj(FLY.x, FLY.y), bob = Math.sin(FLY.t * 2.1) * 0.6;
    drawStack(bird(birdFrame(FLY.t)), bx, by, FLY.hd, lift0 + (FLY.alt + bob) * S * 0.92); }

  drawLighting(vis, E, t);

  if (marker){ marker.t -= dt; if (marker.t <= 0) marker = null; else {
    const [mx, my] = proj(marker.x, marker.y), k = 1 - marker.t / 0.8;
    ctx.strokeStyle = `rgba(232,176,74,${marker.t / 0.8})`; ctx.lineWidth = 2.5 * DPR;
    ctx.beginPath(); ctx.ellipse(mx, my - lift0, (1.5 + k * 3) * S, (1.5 + k * 3) * S * q, 0, 0, 7); ctx.stroke(); } }
  // "tap me" sparkle above the hedgehog
  if (!$('card').classList.contains('open')){
    const p = .6 + .4 * Math.sin(t * 4);
    ctx.fillStyle = `rgba(232,176,74,${p})`; sparkle(hedgeScreen[0], hedgeScreen[1] - 3 * S - Math.sin(t * 3) * 2 * DPR, 2.4 * S * p);
  }

  $('grainOv').style.display = OPT && painted ? 'block' : 'none';
  if (painted && !OPT){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .28; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W / DPR, H / DPR);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  }
  const cpuMs = performance.now() - cpu0;
  PERF.frame.push(cpuMs); PERF.builtSum = (PERF.builtSum || 0) + PERF.builds;
  if (BENCH.rec) BENCH.rec.push({ now, cpu: cpuMs, draws: PERF.draws, ph: { ...PERF.ph } });
  perfTick(now);
  requestAnimationFrame(frame);
}

{ const g = $('pspines'); seed = 31;
  const ring = (rx, ry, n, len, col) => { let d = ''; for (let i = 0; i <= n; i++){ const a = Math.PI * .62 + (i / n) * Math.PI * 1.75, am = a + Math.PI / n, r2 = 1 + len * (.8 + rnd() * .4);
    d += (i ? 'L' : 'M') + (150 + Math.cos(a) * rx).toFixed(1) + ' ' + (165 + Math.sin(a) * ry).toFixed(1) + 'L' + (150 + Math.cos(am) * rx * r2).toFixed(1) + ' ' + (165 + Math.sin(am) * ry * r2).toFixed(1); }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('d', d + 'Z'); p.setAttribute('fill', col); g.appendChild(p); };
  ring(100, 70, 28, .32, '#7a5236'); ring(88, 60, 24, .28, '#9a6a45'); ring(64, 44, 18, .25, '#b48055'); }

setInterval(() => { $('eyeOpen').style.display = 'none'; $('eyeShut').style.display = ''; setTimeout(() => { $('eyeOpen').style.display = ''; $('eyeShut').style.display = 'none'; }, 140); }, 2900);

const SCRIPT = {
  start: { say: ["Oh! Hello there. I didn't hear you coming.", "The lantern by the bridge went out last night, and now the fireflies can't find their way home.", "Will you help me light it again?"],
           choices: [["Of course I will!", 'yes'], ["Why can't you do it, Pip?", 'why']] },
  why:   { say: ["My paws are too short to reach! Hee hee.", "But together we could do it. Will you help?"], choices: [["Okay, let's do it together!", 'yes']] },
  yes:   { say: ["Hooray! Meet me at the bridge when the stars come out.", "I'll bring the matches. You bring your bravest smile!"], choices: [["See you soon, Pip!", 'end']] },
};
let typing = null;
function say(lines, done){
  let li = 0;
  const next = () => {
    if (li >= lines.length) return done();
    const line = lines[li++]; let i = 0; $('text').textContent = ''; $('card').classList.add('talking');
    clearInterval(typing);
    let mouthT = 0;
    typing = setInterval(() => {
      i++; $('text').textContent = line.slice(0, i);
      if (++mouthT % 3 === 0){ const open = $('mouthOpen').style.display === 'none'; $('mouthOpen').style.display = open ? '' : 'none'; $('mouth').style.display = open ? 'none' : ''; }
      if (i >= line.length){ clearInterval(typing); $('card').classList.remove('talking'); $('mouthOpen').style.display = 'none'; $('mouth').style.display = '';
        if (li < lines.length) setTimeout(next, 900); else done(); }
    }, 32);
  };
  next();
}
function node(id){
  $('choices').innerHTML = '';
  if (id === 'end'){ $('card').classList.remove('open'); $('hint').style.opacity = .65; return; }
  const n = SCRIPT[id];
  say(n.say, () => { n.choices.forEach(([label, to]) => { const b = document.createElement('button'); b.textContent = label; b.onclick = () => node(to); $('choices').appendChild(b); }); });
}
function screenToWorld(x, y){
  const lift0 = GH * S * 0.92;
  const dx = (x - W / 2) / S, dy = (y - (H * 0.54 - lift0)) / (S * q), c = Math.cos(rot), s2 = Math.sin(rot);
  return [dx * c + dy * s2 + camX, -dx * s2 + dy * c + camY];
}
function walkTo(x, y, onArrive){ GIRL.tx = x; GIRL.ty = y; GIRL.walking = true; GIRL.onArrive = onArrive || null; marker = { x, y, t: 0.8 }; }
window.__test = { perf: () => PERF.stats, opt: (on) => { if (OPT !== on) $('optBtn').click(); }, drag: (v) => { rotIn += v; rotV = 0; }, setTod: (v) => { tod = v; }, walkTo: (x, y) => walkTo(x, y), pond: () => pondC, lamp: () => [LAMP.x, LAMP.y], fly: (on) => setFly(on), steer: (v) => { FLY.steer = v; }, flight: () => ({ on: FLY.on, x: FLY.x, y: FLY.y, hd: FLY.hd, alt: FLY.alt, r: Math.hypot(FLY.x, FLY.y), camX, camY, rot }), tufts: () => objs.filter(o => o.grass).length };
// ============ benchmark (?bench): runs every scenario, then POSTs the results to /bench ============
async function runBench(){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;left:8px;right:8px;bottom:96px;z-index:20;background:rgba(255,250,240,.94);border-radius:12px;padding:10px 12px;font:600 13px/1.4 system-ui;color:#3b2a2a;box-shadow:0 2px 0 #d8c9ad';
  document.body.appendChild(ov);
  const say2 = s => { ov.textContent = s; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const baseDpr = o => o ? Math.min(1.5, devicePixelRatio || 1) : Math.min(2, devicePixelRatio || 1);
  const tufts = objs.filter(o => o.grass);
  let walker = 0, retry = 0;
  const S0 = { opt: true, tod: 0.3, wind: 1, drag: 0, walk: false, dpr: 0, knob: {} };
  const SC = [
    ['opt day idle', {}],
    ['opt golden idle', { tod: 0.64 }],
    ['opt golden, no mover shadows', { tod: 0.64, knob: { moverShadows: false } }],
    ['opt night idle', { tod: 0.85 }],
    ['opt night, kid in the lamp pool', { tod: 0.85, nearLamp: true }],
    ['opt night, no lamp shadows', { tod: 0.85, knob: { lampShadows: false } }],
    ['opt night, no lamp shadows, no glows', { tod: 0.85, knob: { lampShadows: false, glows: false } }],
    ['opt night, no night layer, no glows', { tod: 0.85, knob: { nightLayer: false, glows: false } }],
    ['opt night idle @ dpr 1.0', { tod: 0.85, dpr: 1 }],
    ['opt day walking meadow', { walk: true }],
    ['opt day windy', { wind: 2.4 }],
    ['opt day dragging', { drag: 0.02 }],
    ['opt night dragging', { tod: 0.85, drag: 0.02 }],
    ['opt day flying (chase camera)', { fly: true }],
    ['opt night flying (chase camera)', { tod: 0.85, fly: true }],
    ['orig day idle', { opt: false }],
    ['orig night idle', { opt: false, tod: 0.85 }],
    ['orig day dragging', { opt: false, drag: 0.02 }],
  ];
  const out = { ua: navigator.userAgent, screen: [screen.width, screen.height], inner: [innerWidth, innerHeight], devicePixelRatio, date: new Date().toISOString(), scenarios: [] };
  // A hidden page gets no animation frames. Keep the screen on, and wait while the page is hidden.
  try { await navigator.wakeLock?.request('screen'); } catch (e) {}
  const visible = async () => { while (document.visibilityState !== 'visible'){ say2('The page is hidden. Show the page to continue.'); await wait(500); } };
  say2('The benchmark starts in 3 seconds. Do not touch the screen.');
  await wait(3000);
  for (let i = 0; i < SC.length; i++){
    const [name, cfg0] = SC[i], cfg = { ...S0, ...cfg0, knob: { ...cfg0.knob } };
    say2(`Scenario ${i + 1} of ${SC.length}: ${name}. Do not touch the screen.`);
    if (OPT !== cfg.opt) $('optBtn').click();
    for (const k in KNOB) KNOB[k] = cfg.knob[k] !== false;
    const dpr = cfg.dpr || baseDpr(cfg.opt);
    if (BENCH.dpr !== dpr){ BENCH.dpr = dpr; resize(); }
    tod = cfg.tod; windK = cfg.wind; BENCH.drag = cfg.drag; lightKey = '';
    GIRL.walking = false; clearInterval(walker);
    setFly(false); camX = 0; camY = 0; zoom = 1; S = S0;
    if (cfg.fly) setFly(true);
    if (cfg.nearLamp){ GIRL.x = LAMP.x + 6; GIRL.y = LAMP.y + 2; }
    if (cfg.walk){ let j = 0; const go = () => { const o = tufts[(j++ * 7) % tufts.length]; walkTo(o.x, o.y); }; go(); walker = setInterval(go, 1200); }
    await visible();
    say2(`Scenario ${i + 1} of ${SC.length}: ${name}. Do not touch the screen.`);
    await wait(1500);                       // warm-up: caches fill, dynamic state settles
    BENCH.rec = [];
    await wait(4000);
    const rec = BENCH.rec; BENCH.rec = null;
    // the page was hidden (almost no frames): run this scenario again, at most twice
    if ((rec.length < 5 || document.visibilityState !== 'visible') && (retry = (retry || 0) + 1) <= 2){ i--; continue; }
    retry = 0;
    const gaps = rec.slice(1).map((r, k) => r.now - rec[k].now).sort((a, b) => a - b);
    const cpus = rec.map(r => r.cpu).sort((a, b) => a - b);
    const P = (a, p) => a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))] : 0;
    const avg = a => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
    const ph = {}; for (const k in PERF.ph) ph[k] = +avg(rec.map(r => r.ph[k])).toFixed(2);
    out.scenarios.push({ name, frames: rec.length, fps: gaps.length ? +(1000 / avg(gaps)).toFixed(1) : 0,
      gap_p50: +P(gaps, .5).toFixed(1), gap_p95: +P(gaps, .95).toFixed(1), gap_max: +(gaps[gaps.length - 1] || 0).toFixed(1),
      slow_pct: +(100 * gaps.filter(g => g > 20).length / Math.max(1, gaps.length)).toFixed(0),
      cpu_avg: +avg(cpus).toFixed(2), cpu_p95: +P(cpus, .95).toFixed(2), draws: Math.round(avg(rec.map(r => r.draws))),
      dpr, canvas: [W, H], ph });
  }
  clearInterval(walker); BENCH.drag = 0; GIRL.walking = false; setFly(false);
  let sent = false;
  try { const r = await fetch('bench', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(out) }); sent = r.ok; } catch (e) {}
  const lines = out.scenarios.map(s => `${s.name}: ${s.fps} fps, p95 ${s.gap_p95} ms, cpu ${s.cpu_avg} ms, ${s.draws} draws`);
  ov.style.whiteSpace = 'pre-wrap'; ov.style.font = '600 11px/1.35 ui-monospace,Menlo,monospace';
  ov.textContent = (sent ? 'The benchmark is complete. The PC received the results.\n\n' : 'The PC did not receive the results. Copy the text below.\n\n') + lines.join('\n') + (sent ? '' : '\n\n' + JSON.stringify(out));
  window.__bench = out;
}
if (BENCH.on) setTimeout(runBench, 500);
function openChat(){ $('card').classList.add('open'); $('hint').style.opacity = 0; node('start'); }
function tap(x, y){
  if ($('card').classList.contains('open')) return;
  if (Math.hypot(x - hedgeScreen[0], y - hedgeScreen[1]) < 34 * DPR){
    // walk up to Pip, stop beside him, then chat
    const a = Math.atan2(GIRL.y - HEDGE.y, GIRL.x - HEDGE.x);
    const tx = HEDGE.x + Math.cos(a) * 7, ty = HEDGE.y + Math.sin(a) * 7;
    if (Math.hypot(GIRL.x - tx, GIRL.y - ty) < 2) openChat(); else walkTo(tx, ty, () => { GIRL.yaw = Math.atan2(HEDGE.y - GIRL.y, HEDGE.x - GIRL.x); openChat(); });
    return;
  }
  const [gx, gy] = proj(GIRL.x, GIRL.y);
  if (Math.hypot(x - gx, y - (gy - GH * S * 0.92 - 5 * S)) < 30 * DPR){ GIRL.hop = 1; return; }
  const [wx, wy] = screenToWorld(x, y);
  if (Math.hypot(wx, wy) < GR - 3) walkTo(wx, wy);
}
document.getElementById('loading').style.display = 'none';
