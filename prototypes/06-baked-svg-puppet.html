<!DOCTYPE html>
<html lang="en">
<head>

<title>The Night Reader — Paper Puppet</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#efe7d8;font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif;color:#3b2a2a;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block;width:100vw;height:100vh}
  #src{position:absolute;left:-10000px;top:0;width:800px;height:1000px;visibility:hidden}
  .bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5}
  .bar button{border:0;border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;background:#fffaf0;color:#3b2a2a;box-shadow:0 2px 0 #d8c9ad}
  .bar button.on{background:#2b9a8c;color:#fff;box-shadow:0 2px 0 #1f7d72}
  #hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:13px;opacity:.65;pointer-events:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;opacity:.7}
  #err{position:fixed;left:10px;right:10px;top:56px;background:#fff3f0;color:#a33;border-radius:10px;padding:8px 10px;font-size:12px;display:none;z-index:20}
</style>

<svg id="src" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. wobble: hand-cut, slightly uneven edges -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence class="seed" type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- 2. paint: wobble + mottled pigment (stretched noise = brush direction) -->
    <filter id="paint" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence class="seed" type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="2" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6" xChannelSelector="R" yChannelSelector="G" result="wob"/>
      <feTurbulence class="seed" type="fractalNoise" baseFrequency="0.012 0.07" numOctaves="4" seed="9" result="mot"/>
      <feColorMatrix in="mot" type="saturate" values="0" result="mg"/>
      <feComponentTransfer in="mg" result="mg2">
        <feFuncR type="linear" slope="0.42" intercept="0.74"/>
        <feFuncG type="linear" slope="0.42" intercept="0.74"/>
        <feFuncB type="linear" slope="0.42" intercept="0.74"/>
      </feComponentTransfer>
      <feBlend in="wob" in2="mg2" mode="multiply" result="m"/>
      <feComposite in="m" in2="wob" operator="in"/>
    </filter>
    <!-- 3. dry brush: same, plus speckled lighter edges -->

<script>
addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + e.message + (e.lineno ? ' (line ' + e.lineno + ')' : ''); });
addEventListener('unhandledrejection', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); });
</script>
<script>
(async () => {
'use strict';
// ---------------- 1. build the procedural bits of the drawing (same generator as the still) ----------------
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
let s = 12345; const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;

// ---- hair: a cloud of overlapping curls ----
const hair = document.getElementById('hair');
[[270,300,72],[530,300,72],[244,382,66],[556,382,66],[258,458,58],[542,458,58],[296,500,46],[504,500,46],[318,240,72],[482,240,72],[400,214,82],[232,430,40],[568,430,40]]
  .forEach(([cx,cy,r]) => el('circle', { cx, cy, r }, hair));
const curls = el('g', { stroke: '#4a363a', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, hair);
s = 77;
for (let i = 0; i < 22; i++){
  const side = i % 2 ? 1 : -1, cx = 400 + side * (150 + rnd() * 52), cy = 270 + rnd() * 220, r = 8 + rnd() * 8, a = rnd() * 6;
  el('path', { d: `M${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r} A${r} ${r} 0 1 1 ${cx + Math.cos(a + 4) * r} ${cy + Math.sin(a + 4) * r}` }, curls);
}
const ribs = document.getElementById('scarfribs');
for (let x = 326; x <= 476; x += 14) el('path', { d: `M${x} ${545 + Math.abs(x - 400) * 0.12} l-6 ${46 - Math.abs(x - 400) * 0.22}` }, ribs);
// bangs peeking under the beanie
const bangs = document.getElementById('bangs');
for (let x = 286; x <= 514; x += 26) el('circle', { cx: x, cy: 352 + Math.abs(x - 400) * 0.03 + (x % 52 ? 4 : 0), r: 17 }, bangs);

// ---- freckles ----
const fr = document.getElementById('freckles'); s = 5;
for (const cx of [322, 478]) for (let i = 0; i < 6; i++) el('circle', { cx: cx + (rnd() - .5) * 46, cy: 440 + (rnd() - .5) * 18, r: 1.8 + rnd() * 1.4 }, fr);

// ---- hedgehog spines: layered jagged rings ----
const sp = document.getElementById('spines');
const spiky = (rx, ry, n, len, col) => {
  let d = '';
  for (let i = 0; i <= n; i++){
    const a = Math.PI * 0.55 + (i / n) * Math.PI * 1.9;
    const r1 = 1, r2 = 1 + len * (0.8 + rnd() * 0.4);
    const x1 = Math.cos(a) * rx * r1, y1 = Math.sin(a) * ry * r1;
    const am = a + Math.PI / n, x2 = Math.cos(am) * rx * r2, y2 = Math.sin(am) * ry * r2;
    d += (i ? 'L' : 'M') + x1.toFixed(1) + ' ' + y1.toFixed(1) + 'L' + x2.toFixed(1) + ' ' + y2.toFixed(1);
  }
  el('path', { d: d + 'Z', fill: col }, sp);
};
s = 31; spiky(52, 40, 26, 0.32, '#7a5236'); spiky(44, 33, 22, 0.28, '#9a6a45'); spiky(30, 22, 16, 0.25, '#b48055');

// ---- floating motifs ----
let motifs = null; const motifGroups = [];
const COLS = ['#f2a490', '#9fd3c7', '#f2c46d', '#c7a6d9', '#e5664a'];
function star(cx, cy, r, col, rot){
  let d = ''; for (let i = 0; i < 10; i++){ const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1); }
  el('path', { d: d + 'Z', fill: col, 'stroke-linejoin': 'round', stroke: col, 'stroke-width': r * 0.25 }, motifs);
}
function sparkle(cx, cy, r, col){
  el('path', { d: `M${cx} ${cy - r} Q${cx} ${cy} ${cx + r} ${cy} Q${cx} ${cy} ${cx} ${cy + r} Q${cx} ${cy} ${cx - r} ${cy} Q${cx} ${cy} ${cx} ${cy - r}Z`, fill: col }, motifs);
}
function leaf(cx, cy, r, col, rot){
  const g = el('g', { transform: `translate(${cx} ${cy}) rotate(${rot})` }, motifs);
  el('path', { d: `M${-r} 0 Q0 ${-r * 0.75} ${r} 0 Q0 ${r * 0.75} ${-r} 0Z`, fill: col }, g);
  el('path', { d: `M${-r * 0.9} 0 L${r * 0.7} 0`, stroke: '#5c8f6b', 'stroke-width': 2, fill: 'none' }, g);
}
function moon(cx, cy, r, col){ el('path', { d: `M${cx} ${cy - r} a${r} ${r} 0 1 0 ${r * 0.9} ${r * 1.5} a${r * 0.8} ${r * 0.8} 0 1 1 ${-r * 0.9} ${-r * 1.5}z`, fill: col }, motifs); }
function placeMotifs(seed){
  s = seed;
  const slots = [];
  for (let y = 110; y < 900; y += 95) for (const side of [-1, 1]) slots.push([400 + side * (250 + rnd() * 110), y + (rnd() - .5) * 50]);
  slots.forEach(([x, y], i) => {
    if (y > 620 && Math.abs(x - 400) < 300) return;                 // keep the body clear
    motifs = el('g', { 'data-part': 'motif' + motifGroups.length, filter: 'url(#paint)' }, document.getElementById('motifLayer'));
    motifGroups.push({ name: 'motif' + motifGroups.length, x, y });
    const t = rnd(), col = COLS[(rnd() * COLS.length) | 0];
    if (t < .32) star(x, y, 13 + rnd() * 10, col, rnd());
    else if (t < .58) sparkle(x, y, 10 + rnd() * 8, col);
    else if (t < .82) leaf(x, y, 14 + rnd() * 6, '#8fc49b', rnd() * 360);
    else moon(x, y, 12 + rnd() * 5, '#f2c46d');
    if (rnd() < .5){ const dx = x + (rnd() - .5) * 60, dy = y + (rnd() - .5) * 50;
      motifs = el('g', { 'data-part': 'motif' + motifGroups.length, filter: 'url(#paint)' }, document.getElementById('motifLayer'));
      motifGroups.push({ name: 'motif' + motifGroups.length, x: dx, y: dy, dot: true });
      el('circle', { cx: dx, cy: dy, r: 3 + rnd() * 2, fill: COLS[(rnd() * 5) | 0] }, motifs); }
  });
}
placeMotifs(3);


// ---------------- 2. bake: each part through its gouache filters, once, into its own bitmap ----------------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const src = document.getElementById('src');
let DPR, W, H, fit;          // fit = { k, ox, oy }: viewBox units -> device px
function layout(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = cv.width = Math.max(1, Math.floor(innerWidth * DPR)); H = cv.height = Math.max(1, Math.floor(innerHeight * DPR));
  const k = Math.min(W / 800, (H - 70 * DPR) / 1000);
  fit = { k, ox: (W - 800 * k) / 2, oy: (H - 1000 * k) / 2 + 18 * DPR };
}
layout();
const BAKE = Math.min(2.4, Math.max(0.6, fit.k * 1.05));   // bake at about display resolution
const MARGIN = { pom: 30, blush: 30, default: 14 };
const parts = {};
const ser = new XMLSerializer();
async function bakePart(name){
  const g = src.querySelector(`[data-part="${name}"]`);
  const bb = g.getBBox(), m = MARGIN[name] ?? (name.startsWith('motif') ? 14 : MARGIN.default);
  const x0 = Math.max(0, Math.floor(bb.x - m)), y0 = Math.max(0, Math.floor(bb.y - m));
  const x1 = Math.min(800, Math.ceil(bb.x + bb.width + m)), y1 = Math.min(1000, Math.ceil(bb.y + bb.height + m));
  const w = x1 - x0, h = y1 - y0;
  // a copy of the whole SVG with only this part, cropped to its box
  const c = src.cloneNode(true);
  c.removeAttribute('id'); c.removeAttribute('style');
  c.querySelectorAll('[data-part]').forEach(p => { if (p.getAttribute('data-part') !== name) p.remove(); });
  c.setAttribute('viewBox', `${x0} ${y0} ${w} ${h}`);
  c.setAttribute('width', Math.ceil(w * BAKE)); c.setAttribute('height', Math.ceil(h * BAKE));
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ser.serializeToString(c));
  const img = new Image(); img.src = url;
  await img.decode();
  const pc = document.createElement('canvas'); pc.width = Math.ceil(w * BAKE); pc.height = Math.ceil(h * BAKE);
  pc.getContext('2d').drawImage(img, 0, 0, pc.width, pc.height);
  parts[name] = { cv: pc, x: x0, y: y0, w, h };
}
const names = [...src.querySelectorAll('[data-part]')].map(p => p.getAttribute('data-part'));
// bake a few at a time so phones don't choke
for (let i = 0; i < names.length; i += 6) await Promise.all(names.slice(i, i + 6).map(bakePart));
document.getElementById('loading').style.display = 'none';

// paper grain tile
function h3(x, y, z){ let q = (x * 374761393 + y * 668265263 + z * 1442695041) | 0; q = Math.imul(q ^ (q >>> 13), 1274126177); return ((q ^ (q >>> 16)) >>> 0) / 4294967296; }
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const gx = grain.getContext('2d'), im = gx.createImageData(256, 256);
  for (let i = 0; i < 65536; i++){ const v = 196 + (h3(i % 256, i >> 8, 5) * 59) | 0; im.data[i*4] = v; im.data[i*4+1] = v * .97; im.data[i*4+2] = v * .92; im.data[i*4+3] = 255; }
  gx.putImageData(im, 0, 0); }
const grainPat = ctx.createPattern(grain, 'repeat');

// ---------------- 3. the rig ----------------
// Pivots in drawing units. Hierarchy: body -> head -> (hair, face bits, beanie -> pom, earrings); body -> hedgehog.
const PIV = { body: [400, 1000], head: [400, 505], pom: [400, 168], earL: [266, 446], earR: [534, 446], hh: [585, 585], hair: [400, 470] };
// a damped spring for follow-through (pom-pom, earrings, hair)
const spring = (k, c) => ({ x: 0, v: 0, k, c, step(dt, drive){ const a = -this.k * this.x - this.c * this.v + drive; this.v += a * dt; this.x += this.v * dt; } });
const S = { pom: spring(90, 7), earL: spring(60, 3.5), earR: spring(60, 3.5), hair: spring(40, 8) };
let headA = 0, headV = 0, prevHeadV = 0;
let tilt = 0, tiltV = 0;                 // tap wobble (a spring of its own)
let giggle = 0, surprise = 0, blushBoost = 0;
let eyeTimer = 3, eyesOpenT = 0, blinkT = 0, look = 0;
let hhHop = 0, hhHopV = 0, hhAwake = 0, hhShake = 0;
let steamBoost = 0;
const hearts = [];
let showRig = false, live = true;
document.getElementById('rig').onclick = e => { showRig = !showRig; e.target.classList.toggle('on', showRig); };
document.getElementById('live').onclick = e => { live = !live; e.target.textContent = live ? 'Static' : 'Animate'; };

function drawPart(name, alpha = 1){
  const p = parts[name]; if (!p) return;
  if (alpha <= 0) return;
  if (alpha !== 1) ctx.globalAlpha = alpha;
  ctx.drawImage(p.cv, p.x, p.y, p.w, p.h);
  if (alpha !== 1) ctx.globalAlpha = 1;
}
const about = ([x, y], fn) => { ctx.translate(x, y); fn(); ctx.translate(-x, -y); };
function heart(x, y, r, col, a){
  ctx.globalAlpha = a; ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y + r * .9);
  ctx.bezierCurveTo(x - r * 1.6, y - r * .1, x - r * .7, y - r * 1.4, x, y - r * .5);
  ctx.bezierCurveTo(x + r * .7, y - r * 1.4, x + r * 1.6, y - r * .1, x, y + r * .9);
  ctx.fill(); ctx.globalAlpha = 1;
}

// ---------------- 4. interaction ----------------
function toDrawing(cx, cy){ return [(cx * DPR - fit.ox) / fit.k, (cy * DPR - fit.oy) / fit.k]; }
cv.addEventListener('pointerdown', e => {
  const [x, y] = toDrawing(e.clientX, e.clientY);
  if (Math.hypot(x - 400, y - 132) < 44){ S.pom.v += 9; return; }                         // boing
  if (Math.hypot(x - 556, y - 552) < 58){ hhHopV = -180; hhAwake = 2.6; hhShake = 1; return; }   // wake the hedgehog
  if (x > 372 && x < 476 && y > 600 && y < 700){ steamBoost = 2.2; return; }               // puff of steam
  if (Math.hypot(x - 400, (y - 372) * .95) < 150){                                         // giggle
    surprise = 0.35; giggle = 1.6; blushBoost = 1; tiltV += 2.2;
    for (let i = 0; i < 9; i++){ const side = i % 2 ? 1 : -1; hearts.push({ x: 400 + side * (150 + Math.random() * 70), y: 400 + (Math.random() - .5) * 120, vx: side * (20 + Math.random() * 60), vy: -60 - Math.random() * 90, r: 7 + Math.random() * 8, t: 0, life: 1.4 + Math.random() * .6, col: ['#ef7f6a', '#f2a490', '#e5664a', '#c7a6d9'][i % 4] }); }
  }
});

// ---------------- 5. animate ----------------
let last = performance.now(), T = 0;
function frame(now){
  if (cv.width !== Math.floor(innerWidth * Math.min(2, devicePixelRatio || 1)) || cv.height !== Math.floor(innerHeight * Math.min(2, devicePixelRatio || 1))) layout();
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  if (live) T += dt;
  const t = T, d = live ? dt : 0;

  // breathing, head sway, tap wobble
  const breathe = Math.sin(t * 1.5) * 0.009 + Math.sin(t * 0.37) * 0.003;
  tiltV += (-60 * tilt - 6 * tiltV) * d; tilt += tiltV * d;
  const newHead = Math.sin(t * 0.6) * 0.035 + Math.sin(t * 1.3 + 1) * 0.01 + tilt * 0.12 + (eyesOpenT > 0 ? 0.03 : 0) * look;
  headV = d > 0 ? (newHead - headA) / d : 0; const headAcc = d > 0 ? (headV - prevHeadV) / d : 0; prevHeadV = headV; headA = newHead;
  // secondary motion: things hanging off the head lag behind its turning
  S.pom.step(d, -headAcc * 0.9 - breathe * 40); S.earL.step(d, -headAcc * 1.4); S.earR.step(d, -headAcc * 1.4); S.hair.step(d, -headAcc * 0.25);
  // eyes: content and closed; every few seconds she peeks at the hedgehog
  eyeTimer -= d; if (eyeTimer <= 0 && giggle <= 0){ eyesOpenT = 1.6 + Math.random(); eyeTimer = 4 + Math.random() * 4; look = 1; setTimeout(() => { if (hhAwake <= 0) hhAwake = 1.6; }, 350); }
  eyesOpenT = Math.max(0, eyesOpenT - d); surprise = Math.max(0, surprise - d); giggle = Math.max(0, giggle - d); blushBoost = Math.max(0, blushBoost - d * 0.6);
  blinkT = (blinkT + d) % 3.1;
  const eyesOpen = surprise > 0 || (eyesOpenT > 0 && !(eyesOpenT > 0.4 && blinkT > 2.95));
  // hedgehog
  hhHopV += (-900 * hhHop - 9 * hhHopV) * d; hhHop += hhHopV * d; hhAwake = Math.max(0, hhAwake - d); hhShake = Math.max(0, hhShake - d * 1.5);
  steamBoost = Math.max(0, steamBoost - d);

  // ---- draw ----
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#efe7d8'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(fit.k, 0, 0, fit.k, fit.ox, fit.oy);
  ctx.fillStyle = '#f7f1e5'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0, 0, 800, 1000, 18) : ctx.rect(0, 0, 800, 1000); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 800, 1000); ctx.clip();

  // motifs drift, bob and twinkle
  for (const m of motifGroups){
    const ph = (m.x * 0.013 + m.y * 0.007) % 6.28, dy = Math.sin(t * 0.8 + ph) * 7, rr = Math.sin(t * 0.5 + ph) * 0.18, sc = 1 + Math.sin(t * 2 + ph * 3) * (m.dot ? 0.15 : 0.06);
    ctx.save(); ctx.translate(m.x, m.y + dy); ctx.rotate(rr); ctx.scale(sc, sc); ctx.translate(-m.x, -m.y); drawPart(m.name); ctx.restore();
  }

  // body (breathing: a little taller and narrower on the in-breath, anchored at the bottom edge)
  ctx.save();
  about(PIV.body, () => ctx.scale(1 - breathe * 0.35, 1 + breathe));

  // head group (hair is behind the body, so draw it first inside the head transform)
  const headXform = () => { about(PIV.head, () => ctx.rotate(headA)); ctx.translate(0, -Math.abs(breathe) * 120 * 0 ); };
  ctx.save(); headXform(); about(PIV.hair, () => ctx.rotate(S.hair.x * 0.5)); drawPart('hair'); ctx.restore();
  drawPart('neck'); drawPart('torso');

  ctx.save(); headXform();
  drawPart('face');
  for (const [n, sp] of [['earL', S.earL], ['earR', S.earR]]){ ctx.save(); about(PIV[n], () => ctx.rotate(sp.x * 0.6 - headA * 1.5)); drawPart(n); ctx.restore(); }
  const bl = 0.85 + Math.sin(t * 1.1) * 0.12 + blushBoost * 0.9;
  drawPart('blush', Math.min(1, bl)); if (bl > 1) drawPart('blush', bl - 1);
  if (eyesOpen){ ctx.save(); ctx.translate(look * 5 + (surprise > 0 ? 0 : 0), surprise > 0 ? -2 : 1); drawPart('eyesOpen'); ctx.restore(); }
  else drawPart('eyesClosed');
  ctx.save(); ctx.translate(0, surprise > 0 ? -6 : giggle > 0 ? -3 : 0); drawPart('brows'); ctx.restore();
  if (giggle > 0 && surprise <= 0){ const k2 = 1 + Math.abs(Math.sin(t * 22)) * 0.12; ctx.save(); about([400, 478], () => ctx.scale(1, k2)); drawPart('mouthOpen'); ctx.restore(); }
  else if (surprise > 0){ ctx.save(); about([400, 478], () => ctx.scale(0.6, 1.1)); drawPart('mouthOpen'); ctx.restore(); }
  else drawPart('mouth');
  drawPart('nose'); drawPart('bangs'); drawPart('beanie');
  ctx.save(); about(PIV.pom, () => { ctx.rotate(S.pom.x * 0.35); ctx.scale(1 + S.pom.v * 0.004, 1 - S.pom.v * 0.004); }); drawPart('pom'); ctx.restore();
  ctx.restore();   // head

  // hedgehog on the shoulder: breathes, hops when tapped, peeks back at her
  ctx.save();
  ctx.translate(0, Math.min(0, hhHop));
  about(PIV.hh, () => { const b2 = Math.sin(t * 2.4) * 0.025; ctx.rotate(Math.sin(t * 40) * 0.04 * hhShake); ctx.scale(1 + b2 * 0.5, 1 + b2); });
  drawPart('hhBody'); drawPart(hhAwake > 0 && !(hhAwake > 0.5 && (t % 1.7) > 1.62) ? 'hhEyeOpen' : 'hhEyeClosed');
  ctx.restore();

  drawPart('front');

  // steam: each wisp rises, sways and fades; two copies half a cycle apart keep it continuous
  for (let i = 0; i < 3; i++) for (const off of [0, 0.5]){
    const sp = 0.32 + steamBoost * 0.5, p = ((t * sp + i / 3 + off) % 1);
    const a = Math.sin(Math.PI * p) * (0.75 + steamBoost * 0.12);
    ctx.save(); ctx.translate(Math.sin(t * 1.5 + i * 2 + off * 6) * 5 * p, -p * 46); about([412, 600], () => ctx.scale(1 + p * 0.3, 1 + p * 0.2)); drawPart('steam' + i, Math.min(1, a)); ctx.restore();
  }
  ctx.restore();   // body

  // giggle hearts
  for (const hh of hearts){ hh.t += d; hh.x += hh.vx * d; hh.y += hh.vy * d; hh.vy += 30 * d; }
  for (let i = hearts.length - 1; i >= 0; i--) if (hearts[i].t > hearts[i].life) hearts.splice(i, 1);
  for (const hh of hearts){ const a = Math.min(1, (hh.life - hh.t) * 2) * Math.min(1, hh.t * 6); heart(hh.x, hh.y, hh.r * (0.6 + Math.min(1, hh.t * 4) * 0.4), hh.col, a * 0.9); }

  // rig overlay: pivots and bones
  if (showRig){
    ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(43,154,140,.9)'; ctx.fillStyle = 'rgba(229,102,74,.95)'; ctx.font = 'bold 15px system-ui';
    const bones = [['body', 'head'], ['head', 'pom'], ['head', 'earL'], ['head', 'earR'], ['head', 'hair'], ['body', 'hh']];
    for (const [a, b] of bones){ ctx.beginPath(); ctx.moveTo(...PIV[a]); ctx.lineTo(...PIV[b]); ctx.stroke(); }
    for (const k in PIV){ const [x, y] = PIV[k]; ctx.beginPath(); ctx.arc(x, y, 6, 0, 7); ctx.fill(); ctx.fillText(k, x + 9, y - 6); }
    ctx.strokeStyle = 'rgba(59,42,42,.35)'; ctx.lineWidth = 1;
    for (const n in parts){ const p = parts[n]; if (!n.startsWith('motif')) ctx.strokeRect(p.x, p.y, p.w, p.h); }
  }
  ctx.restore();   // clip

  // paper grain over the page
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .22; ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W / DPR, H / DPR);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__test = { parts: () => Object.keys(parts).length, tap: (x, y) => cv.dispatchEvent(new PointerEvent('pointerdown', { clientX: (x * fit.k + fit.ox) / DPR, clientY: (y * fit.k + fit.oy) / DPR })) };
})();
</script>
</body>
</html>
